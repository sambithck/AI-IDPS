# nginx/idps.conf
# Example reverse-proxy config for the AI-IDPS dashboard + WebSocket.
# Place in /etc/nginx/sites-available/ (Linux) or equivalent on Windows Nginx,
# then symlink/enable and reload nginx.

server {
    listen 443 ssl;
    server_name idps.local;

    ssl_certificate     /etc/nginx/ssl/idps.crt;
    ssl_certificate_key /etc/nginx/ssl/idps.key;

    # REST API + dashboard pages
    location / {
        proxy_pass http://127.0.0.1:5000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # WebSocket (Socket.IO) upgrade support
    location /socket.io/ {
        proxy_pass http://127.0.0.1:5000/socket.io/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }
}

server {
    listen 80;
    server_name idps.local;
    return 301 https://$host$request_uri;
}
